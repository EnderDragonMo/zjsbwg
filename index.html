<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浙江省博物馆 · Zhejiang Provincial Museum</title>
<meta name="description" content="浙江省博物馆四大常设陈列：越地长歌、昆山片玉、十里红妆、翰墨丹青。">
<meta name="theme-color" content="#0a0907">
<style>
  :root{
    --ink:#0a0907;
    --paper:#f2ebdd;
    --paper-dim:rgba(242,235,221,.60);
    --gold:#b28f57;
    --gold-soft:rgba(178,143,87,.42);
    --seal:#a03127;
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
    --sans:"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --ease:cubic-bezier(.19,1,.22,1);
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  img{display:block}
  a{color:inherit}

  /* ---------- 舞台：四图铺满一屏 ---------- */
  .stage{
    position:relative;
    height:100vh;
    height:100dvh;
    min-height:600px;
    overflow:hidden;
    background:var(--ink);
  }
  .mosaic{
    position:absolute;
    inset:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:2px;
    background:#050403;
  }

  .tile{
    position:relative;
    display:block;
    overflow:hidden;
    background:#15120e;
    text-decoration:none;
    isolation:isolate;
    animation:tileIn 1.25s var(--ease) both;
  }
  .tile:nth-child(1){animation-delay:.05s}
  .tile:nth-child(2){animation-delay:.17s}
  .tile:nth-child(3){animation-delay:.29s}
  .tile:nth-child(4){animation-delay:.41s}

  @keyframes tileIn{
    from{opacity:0;transform:scale(1.035)}
    to{opacity:1;transform:scale(1)}
  }

  .tile img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scale(1.03);
    filter:saturate(.92) contrast(1.03);
    transition:transform 1.7s var(--ease),filter .9s ease;
  }

  .veil{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,
      rgba(8,7,6,.62) 0%,
      rgba(8,7,6,.10) 26%,
      rgba(8,7,6,.08) 52%,
      rgba(8,7,6,.88) 100%);
    transition:opacity .9s ease;
  }

  .tile::after{
    content:"";
    position:absolute;
    inset:16px;
    border:1px solid rgba(178,143,87,0);
    z-index:1;
    pointer-events:none;
    transition:border-color .7s ease;
  }

  .cap{
    position:absolute;
    left:clamp(20px,2.8vw,46px);
    bottom:clamp(26px,4.6vh,52px);
    z-index:2;
    display:block;
    transition:transform .8s var(--ease);
  }
  .eyebrow{
    display:block;
    margin-bottom:14px;
    font-family:var(--sans);
    font-size:10px;
    font-weight:400;
    letter-spacing:.32em;
    color:var(--gold);
  }
  .zh{
    display:block;
    font-size:clamp(26px,2.35vw,38px);
    font-weight:600;
    line-height:1.15;
    letter-spacing:.10em;
    text-shadow:0 2px 26px rgba(0,0,0,.4);
  }
  .sub{
    display:block;
    margin-top:12px;
    font-family:var(--sans);
    font-size:12.5px;
    letter-spacing:.16em;
    color:var(--paper-dim);
  }

  .cap::after{
    content:"";
    display:block;
    width:58px;
    height:1px;
    margin-top:20px;
    background:var(--gold);
    opacity:.85;
    transform:scaleX(.32);
    transform-origin:left;
    transition:transform .7s var(--ease);
  }

  /* 右侧两图的文字靠外缘排列，避开中央馆名 */
  .tile:nth-child(even) .cap{
    left:auto;
    right:clamp(20px,2.8vw,46px);
    text-align:right;
  }
  .tile:nth-child(even) .cap::after{
    margin-left:auto;
    transform-origin:right;
  }

  .tile:focus-visible{outline:2px solid var(--gold);outline-offset:-7px}
  .tile:focus-visible .cap::after{transform:scaleX(1)}

  @media (hover:hover) and (pointer:fine){
    .tile:hover img{transform:scale(1.085);filter:saturate(1.02) contrast(1.05)}
    .tile:hover .veil{opacity:.86}
    .tile:hover .cap{transform:translateY(-8px)}
    .tile:hover .cap::after{transform:scaleX(1)}
    .tile:hover::after{border-color:rgba(178,143,87,.32)}
  }

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:7;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:clamp(18px,2.6vh,28px) clamp(20px,3vw,44px);
    background:linear-gradient(180deg,rgba(6,5,4,.55),rgba(6,5,4,0));
    pointer-events:none;
  }
  .mark{display:flex;align-items:center;gap:13px}
  .mark-seal{
    display:grid;
    place-items:center;
    width:27px;
    height:27px;
    background:var(--seal);
    color:#f7eddc;
    font-size:14px;
    font-weight:600;
    border-radius:2px;
    transform:rotate(-2deg);
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .mark-txt{
    display:flex;
    flex-direction:column;
    gap:5px;
    font-family:var(--sans);
    font-size:9.5px;
    letter-spacing:.26em;
    color:rgba(242,235,221,.85);
  }
  .mark-txt em{
    font-style:normal;
    font-size:8px;
    letter-spacing:.4em;
    color:rgba(242,235,221,.42);
  }
  .topbar-meta{
    margin:0;
    font-family:var(--sans);
    font-size:10px;
    letter-spacing:.24em;
    color:rgba(242,235,221,.55);
  }

  /* ---------- 中央馆名 ---------- */
  .center{
    position:absolute;
    inset:0;
    z-index:4;
    display:grid;
    place-items:center;
    padding:24px;
    pointer-events:none;
  }
  .plaque{
    position:relative;
    width:min(32vw,420px);
    min-width:296px;
    padding:clamp(28px,4vh,44px) clamp(24px,2.6vw,38px);
    text-align:center;
    background:rgba(10,9,7,.76);
    border:1px solid rgba(178,143,87,.42);
    box-shadow:0 40px 90px rgba(0,0,0,.55);
    -webkit-backdrop-filter:blur(9px) saturate(.9);
    backdrop-filter:blur(9px) saturate(.9);
    animation:plaqueIn 1.4s var(--ease) .55s both;
  }
  @keyframes plaqueIn{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:none}
  }
  .plaque::before{
    content:"";
    position:absolute;
    inset:9px;
    border:1px solid rgba(178,143,87,.18);
    pointer-events:none;
  }
  .kicker{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:0 0 clamp(16px,2.6vh,26px);
    font-family:var(--sans);
    font-size:10.5px;
    letter-spacing:.34em;
    text-indent:.34em;
    color:var(--gold);
  }
  .kicker i{display:block;width:22px;height:1px;background:rgba(178,143,87,.5)}
  .name{
    margin:0;
    font-size:clamp(30px,2.7vw,42px);
    font-weight:600;
    line-height:1.3;
    letter-spacing:.14em;
    text-indent:.14em;
    color:#f8f1e4;
  }
  .en{
    margin:clamp(16px,2.4vh,24px) 0 0;
    font-family:var(--sans);
    font-size:8.5px;
    letter-spacing:.26em;
    text-indent:.26em;
    color:rgba(242,235,221,.46);
  }
  .seal{
    position:absolute;
    right:-16px;
    bottom:-16px;
    width:54px;
    height:54px;
    display:grid;
    place-items:center;
    background:var(--seal);
    color:#f7efdf;
    font-size:12.5px;
    line-height:1.25;
    letter-spacing:.08em;
    writing-mode:vertical-rl;
    text-orientation:upright;
    border-radius:2px;
    transform:rotate(2.5deg);
    box-shadow:0 10px 24px rgba(0,0,0,.45);
  }

  /* ---------- 底部提示 ---------- */
  .hint{
    position:absolute;
    left:50%;
    bottom:16px;
    z-index:6;
    margin:0;
    padding:9px 20px;
    transform:translateX(-50%);
    border:1px solid rgba(242,235,221,.10);
    border-radius:999px;
    background:rgba(8,7,6,.55);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
    font-family:var(--sans);
    font-size:10.5px;
    letter-spacing:.28em;
    text-indent:.28em;
    color:rgba(242,235,221,.5);
    white-space:nowrap;
  }

  /* ---------- 移动端 ---------- */
  .masthead{display:none}

  @media (max-width:900px){
    .topbar,
    .center,
    .hint{display:none}

    .masthead{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:64px 24px 48px;
      text-align:center;
      background:radial-gradient(120% 120% at 50% -10%,#1d1913 0%,#0e0c09 55%,#0a0907 100%);
      border-bottom:1px solid rgba(178,143,87,.16);
    }
    .masthead-kicker{
      margin:0 0 20px;
      font-family:var(--sans);
      font-size:9px;
      letter-spacing:.4em;
      text-indent:.4em;
      color:rgba(178,143,87,.85);
    }
    .m-name{
      margin:0;
      font-size:clamp(28px,8vw,40px);
      font-weight:600;
      letter-spacing:.16em;
      text-indent:.16em;
      line-height:1.3;
      color:#f8f1e4;
    }
    .m-sub{
      margin:16px 0 0;
      font-size:12px;
      letter-spacing:.3em;
      text-indent:.3em;
      color:rgba(242,235,221,.5);
    }
    .m-rule{
      display:block;
      width:1px;
      height:36px;
      margin:26px 0 22px;
      background:linear-gradient(180deg,rgba(178,143,87,.65),rgba(178,143,87,0));
    }
    .m-note{
      margin:0;
      font-family:var(--sans);
      font-size:10px;
      letter-spacing:.28em;
      text-indent:.28em;
      color:rgba(242,235,221,.42);
    }

    .stage{height:auto;min-height:0;overflow:visible}
    .mosaic{
      position:static;
      grid-template-columns:1fr;
      grid-template-rows:none;
      gap:2px;
      height:auto;
    }
    .tile{height:clamp(280px,62vw,400px)}
    .cap,
    .tile:nth-child(even) .cap{
      left:22px;
      right:22px;
      bottom:26px;
      text-align:left;
    }
    .cap::after,
    .tile:nth-child(even) .cap::after{
      margin-left:0;
      transform-origin:left;
    }
    .zh{font-size:30px}
    .sub{font-size:12px}
    .tile::after{inset:10px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
    .tile{opacity:1}
    .plaque{opacity:1;transform:none}
  }

  @media print{
    .stage{height:auto}
    .mosaic{position:static;display:block}
    .tile{height:420px}
    .plaque{background:#0a0907}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="mark">
    <span class="mark-seal" aria-hidden="true">浙</span>
    <span class="mark-txt">ZHEJIANG PROVINCIAL MUSEUM<em>SINCE 1929</em></span>
  </div>
  <p class="topbar-meta">杭州 · 孤山馆区 / 之江馆区</p>
</header>

<header class="masthead">

  <p class="m-name">浙江省博物馆</p>
  <p class="m-sub">之江潮涌 · 越地长歌</p>
  <span class="m-rule" aria-hidden="true"></span>
  <p class="m-note">四大常设陈列 · 点击图片进入</p>
</header>

<main class="stage">
  <nav class="mosaic" aria-label="四大常设陈列">

    <a class="tile" href="pages/yuedichangge.html">
      <img src="main/233.png" alt="越地长歌——浙江历史文化陈列" width="1600" height="1200">
      <span class="veil" aria-hidden="true"></span>
      <span class="cap">
        <span class="eyebrow">EXHIBITION 01</span>
        <span class="zh">越地长歌</span>
        <span class="sub">浙江历史文化陈列</span>
      </span>
    </a>

    <a class="tile" href="pages/kunshanpianyu.html">
      <img src="main/433.png" alt="昆山片玉——陶瓷与青瓷陈列" width="1600" height="1200">
      <span class="veil" aria-hidden="true"></span>
      <span class="cap">
        <span class="eyebrow">EXHIBITION 02</span>
        <span class="zh">昆山片玉</span>
        <span class="sub">陶瓷与青瓷陈列</span>
      </span>
    </a>

    <a class="tile" href="pages/shilihongzhuang.html">
      <img src="main/633.png" alt="十里红妆——宁绍婚俗陈列" width="1600" height="1200">
      <span class="veil" aria-hidden="true"></span>
      <span class="cap">
        <span class="eyebrow">EXHIBITION 03</span>
        <span class="zh">十里红妆</span>
        <span class="sub">宁绍婚俗陈列</span>
      </span>
    </a>

    <a class="tile" href="pages/hanmodanqing.html">
      <img src="main/833.png" alt="翰墨丹青——书画与文澜陈列" width="1600" height="1200">
      <span class="veil" aria-hidden="true"></span>
      <span class="cap">
        <span class="eyebrow">EXHIBITION 04</span>
        <span class="zh">翰墨丹青</span>
        <span class="sub">书画与文澜陈列</span>
      </span>
    </a>

  </nav>

  <div class="center">
    <div class="plaque">
      <p class="kicker"><i aria-hidden="true"></i>国家一级博物馆<i aria-hidden="true"></i></p>
      <h1 class="name">浙江省博物馆</h1>
      <p class="en">ZHEJIANG PROVINCIAL MUSEUM</p>
      <span class="seal" aria-hidden="true">浙博</span>
    </div>
  </div>

  <p class="hint">点击图片 · 进入展厅</p>
</main>

</body>
